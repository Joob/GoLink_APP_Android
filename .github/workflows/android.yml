name: Android CI

on:
  push:
  pull_request:

# O token do workflow só lê o repositório.
permissions:
  contents: read

jobs:
  build:
    name: Unit tests, lint, debug & release build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug
        run: ./gradlew assembleDebug

      # Release minificado (R8) sem assinatura: apanha regras de ProGuard em falta
      # (ex.: JNA/lazysodium) que só partem o build de produção.
      - name: Build release (R8, sem assinatura)
        run: ./gradlew assembleRelease

      - name: Guardar relatorios em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
